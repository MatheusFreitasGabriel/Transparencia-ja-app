name: Testes automatizados

on:
  push:
  pull_request:

jobs:
  api-tests:
    name: API REST, HTTP e JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Executar testes da API
        run: bash gradlew -p api clean test

  android-unit-tests:
    name: App Android e cenários BDD existentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Executar testes unitários Android
        run: bash gradlew :app:testDebugUnitTest
